name: create ETL pipeline
on:
  push:
    branches:
      - main

jobs:
  extract_data_from_files:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: run extract_data.py
      run: python extract_data.py   

  transform_data_from_files:
    runs-on: ubuntu-latest
    needs: extract_data_from_files
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: run transform_data.py   
      run: python transform_data.py 
  load_data_files:
    runs-on: ubuntu-latest
    needs:  extract_data_from_files
    steps:
    - name: checkout code
      uses: actions/checkout@v2
    - name: run load_data.py
      run: python load_data.py  
  printing:
    runs-on: ubuntu-latest
    needs: load_data_files 
    steps: 
    - name: checkout code
      uses: actions/checkout@v2
    - name: print
      run: echo ("welcome")       